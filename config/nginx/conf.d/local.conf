# first we declare our upstream server, which is our Gunicorn application
upstream tour_management_project_server {
    # docker will automatically resolve this to the correct address
    # because we use the same name as the service: "tour_management"
    server tour_management:9300;
}


# now we declare our main server
server {

    listen 80;
    client_max_body_size 30M;
    uwsgi_buffer_size 64k;
    uwsgi_buffers 8 16k;
    server_name localhost;
    uwsgi_busy_buffers_size 70k;

    # Serve media files (images) directly from Nginx - HIGH PERFORMANCE!
    location /media/ {
        alias /tour_management_project/media/;

        # Cache images for 30 days in browser
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Don't log every image request (reduces I/O)
        access_log off;

        # Enable gzip compression for images
        gzip on;
        gzip_types image/jpeg image/png image/gif image/webp;
        gzip_vary on;

        # Security headers
        add_header X-Content-Type-Options "nosniff";

        # Allow CORS for images
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    }

    # Serve static files directly from Nginx
    location /static/ {
        alias /tour_management_project/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy all other requests to Django/Gunicorn
    location / {
        # everything is passed to Gunicorn
        proxy_pass http://tour_management_project_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        proxy_connect_timeout 10080s;
        proxy_send_timeout 10080;
        proxy_read_timeout 10080;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream timeout off;

    }

}
